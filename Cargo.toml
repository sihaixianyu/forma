[package]
name = "json-lens"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A native and WebAssembly JSON editor and viewer"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
rfd = "0.15"
csv = "1.4"
base64 = "0.22"
percent-encoding = "2.3"
similar = { version = "2.7.0", features = ["wasm32_web_time"] }
web-time = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Url", "Window", "console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "processing"
path = "bench/processing.rs"
harness = false

[[test]]
name = "processing"
path = "test/processing.rs"

[[test]]
name = "navigation"
path = "test/navigation.rs"

[[test]]
name = "edit"
path = "test/edit.rs"

[[test]]
name = "alignment"
path = "test/alignment.rs"

[[bench]]
name = "workspace"
path = "bench/workspace.rs"
harness = false

[[bench]]
name = "comparison"
path = "bench/comparison.rs"
harness = false
