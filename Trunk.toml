[build]
target = "index.html"
dist = "dist"
public_url = "./"
filehash = true
locked = true
pattern_script = """
<script type="module">
import init, * as bindings from '{base}{js}';
window.formaWorkerConfig = {
  moduleUrl: new URL('{base}{js}', document.baseURI).href,
  wasmUrl: new URL('{base}{wasm}', document.baseURI).href,
  workerUrl: new URL('{base}forma-worker.js?v={wasm}', document.baseURI).href,
  debug: new URLSearchParams(location.search).get('debug') === '1'
};
window.wasmBindings = bindings;
try {
  const wasm = await init({ module_or_path: '{base}{wasm}' });
  dispatchEvent(new CustomEvent('TrunkApplicationStarted', {detail: { wasm: wasm }}));
} catch (error) {
  const message = `[Forma STARTUP] ${error?.stack ?? error}`;
  console.error(message);

  const loading = document.getElementById('loading');
  if (loading) {
    loading.textContent = message;
    loading.style.whiteSpace = 'pre-wrap';
    loading.style.maxWidth = 'min(90vw, 960px)';
    loading.style.textAlign = 'left';
  }

  fetch(`http://127.0.0.1:8081/log?message=${encodeURIComponent(message)}`, {
    mode: 'no-cors',
    cache: 'no-store',
  }).catch(() => {});
}
</script>
"""

[serve]
addresses = ["127.0.0.1"]
port = 8080

[watch]
ignore = ["forma-debug.log"]
